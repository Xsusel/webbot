<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Bot Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 800px; margin-top: 50px; }
        #logs { height: 200px; overflow-y: scroll; background: #f8f9fa; border: 1px solid #dee2e6; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">Twitch Automation Controller</h1>

        <!-- Status -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Status</h5>
                <p>Total Bots: <span id="total-bots">0</span></p>
                <p>Connected: <span id="connected-bots">0</span></p>
                <p>CPU Usage: <span id="cpu-usage">0</span>%</p>
                <p>RAM Usage: <span id="ram-usage">0</span>%</p>
            </div>
        </div>

        <!-- Token Upload -->
        <div class="card mb-4">
            <div class="card-header">1. Upload Tokens</div>
            <div class="card-body">
                <form id="token-form">
                    <div class="mb-3">
                        <textarea class="form-control" id="tokens" rows="5" placeholder="oauth:token1&#10;oauth:token2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Load Tokens</button>
                </form>
            </div>
        </div>

        <!-- Controls -->
        <div class="card mb-4">
            <div class="card-header">2. Controls</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="channel" class="form-label">Target Channel / User ID</label>
                    <input type="text" class="form-control" id="channel" placeholder="e.g. 123456 or ninja">
                </div>
                <div class="mb-3">
                    <label for="messages" class="form-label">Chat Messages (Randomly cycled)</label>
                    <textarea class="form-control" id="messages" rows="3" placeholder="Hello!&#10;Nice stream!"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button id="btn-chat" class="btn btn-success">Start Chat</button>
                    <button id="btn-follow" class="btn btn-warning">Mass Follow</button>
                    <button id="btn-stop" class="btn btn-danger">Stop All</button>
                </div>
            </div>
        </div>

        <!-- Logs/Output -->
        <div id="alert-box"></div>
    </div>

    <script>
        function showAlert(msg, type='success') {
            const div = document.createElement('div');
            div.className = `alert alert-${type} alert-dismissible fade show`;
            div.innerHTML = `${msg} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
            document.getElementById('alert-box').prepend(div);
        }

        async function updateStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                document.getElementById('total-bots').innerText = data.total_bots;
                document.getElementById('connected-bots').innerText = data.connected_bots;
                document.getElementById('cpu-usage').innerText = data.cpu_percent;
                document.getElementById('ram-usage').innerText = data.ram_percent;
            } catch(e) {
                console.error("Status error", e);
            }
        }

        document.getElementById('token-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tokens = document.getElementById('tokens').value;
            const formData = new FormData();
            formData.append('tokens', tokens);

            const res = await fetch('/upload_tokens', { method: 'POST', body: formData });
            const data = await res.json();
            showAlert(data.message);
            updateStatus();
        });

        async function sendAction(action) {
            const channel = document.getElementById('channel').value;
            const payload = document.getElementById('messages').value;

            if (!channel) return showAlert("Channel is required", "danger");

            const res = await fetch('/start_action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ channel, action, payload })
            });
            const data = await res.json();
            showAlert(data.message || data.error, res.ok ? 'success' : 'danger');
            updateStatus();
        }

        document.getElementById('btn-chat').onclick = () => sendAction('chat');
        document.getElementById('btn-follow').onclick = () => sendAction('follow');

        document.getElementById('btn-stop').onclick = async () => {
            const res = await fetch('/stop_action', { method: 'POST' });
            const data = await res.json();
            showAlert(data.message, 'warning');
            updateStatus();
        };

        setInterval(updateStatus, 3000);
        updateStatus();
    </script>
</body>
</html>
